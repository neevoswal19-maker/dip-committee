name: Intraday

# The intraday ORB + VWAP pullback strategy, live, 9:25 to 15:12 IST in one
# run (inside GitHub's 6-hour job limit; a 9:12 start was cut off at 15:10).
# The 9:15-9:25 opening-range candles are read from Yahoo at 9:30.
# Paper mode until it passes its 40-trade test. An external timer (cron-job.org) starts it at 9:25 IST on
# weekdays; the schedule below is only a backup, because GitHub runs
# scheduled jobs late. A second start on the same day exits at once.
on:
  schedule:
    - cron: "55 3 * * 1-5"           # 09:25 IST, backup only
  workflow_dispatch:
    inputs:
      no_alerts:
        description: "Run without sending Telegram messages"
        type: boolean
        default: false

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the session
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_alerts }}" = "true" ]; then
            ARGS="--no-alerts"
          fi
          python jobs/intraday_live.py $ARGS
