name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. A portfolio tracker is exactly the kind of repo that goes quiet
# for months while still needing its daily job, so this touches the repo
# monthly to keep the scan's cron alive.

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Touch the heartbeat file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-alive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-alive
          git diff --staged --quiet || git commit -m "chore: keepalive so the daily scan cron stays enabled"
          git push
