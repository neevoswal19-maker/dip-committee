name: Daily scan

on:
  schedule:
    # 19:00 IST on weekdays. GitHub cron is UTC, and IST is UTC+5:30, so
    # 13:30 UTC. NSE publishes the day's bhavcopy from about 18:30 IST, so
    # this leaves half an hour of slack.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap the universe (blank = full Nifty 500)"
        required: false
        default: ""
      no_alerts:
        description: "Run without sending Telegram messages"
        type: boolean
        default: false
      summary:
        description: "Send a summary even if nothing was found"
        type: boolean
        default: false

concurrency:
  # Never let a manual run collide with the scheduled one. Two jobs writing
  # the same scan would double-insert candidates.
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The runner is ephemeral, so the disk cache starts empty every time.
      # Restoring it saves re-downloading six years of prices for 500 symbols
      # and any bhavcopies the database does not already hold.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Run the scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.no_alerts }}" = "true" ]; then
            ARGS="$ARGS --no-alerts"
          fi
          if [ "${{ github.event.inputs.summary }}" = "true" ]; then
            ARGS="$ARGS --summary"
          fi
          python jobs/daily_scan.py $ARGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs-${{ github.run_id }}
          path: |
            data/*.log
            reports/
          retention-days: 7
          if-no-files-found: ignore
