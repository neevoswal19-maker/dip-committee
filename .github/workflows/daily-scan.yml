name: Daily scan

on:
  schedule:
    # Messages arrive at 08:00 IST, Monday to Friday, before the 09:15 open,
    # covering the previous session (Monday's covers Friday).
    #
    # The run starts at 07:17 IST (01:47 UTC) and holds every message until
    # 08:00 with --send-at. GitHub often starts scheduled runs late,
    # especially on the hour, and the scan takes about ten minutes, so a run
    # started at 08:00 would deliver at 08:10-08:45. 17 minutes past avoids
    # the on-the-hour queue. If GitHub is very late the run sends as soon as
    # it finishes.
    - cron: "47 1 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap the universe (blank = full Nifty 500)"
        required: false
        default: ""
      no_alerts:
        description: "Run without sending Telegram messages"
        type: boolean
        default: false
      summary:
        description: "Send a summary even if nothing was found"
        type: boolean
        default: false

concurrency:
  # Never let a manual run collide with the scheduled one. Two jobs writing
  # the same scan would double-insert candidates.
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Scan (~10 min) plus holding until 08:00 (~30 min), with slack.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The runner is ephemeral, so the disk cache starts empty every time.
      # Restoring it saves re-downloading six years of prices for 500 symbols
      # and any bhavcopies the database does not already hold.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Run the scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.no_alerts }}" = "true" ]; then
            ARGS="$ARGS --no-alerts"
          fi
          if [ "${{ github.event.inputs.summary }}" = "true" ]; then
            ARGS="$ARGS --summary"
          fi
          # Only the scheduled run waits for 08:00. A manual run sends as
          # soon as it finishes.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --send-at 08:00"
          fi
          python jobs/daily_scan.py $ARGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs-${{ github.run_id }}
          path: |
            data/*.log
            reports/
          retention-days: 7
          if-no-files-found: ignore
