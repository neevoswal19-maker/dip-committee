name: Intraday research

# Backtests the intraday ORB + VWAP pullback rules on every stored session
# (Yahoo's last 60 plus whatever the live job has kept), stores fresh bars so
# the history grows, and scores the paper trades. Uploads
# reports/intraday_research.md. Weekly, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 6"             # Saturdays 10:00 IST
  push:
    branches: ["feature/intraday-**"]

concurrency:
  group: intraday-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python jobs/intraday_research.py

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-research-${{ github.run_id }}
          path: reports/intraday_*
          retention-days: 30
          if-no-files-found: warn
