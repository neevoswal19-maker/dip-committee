name: Public site

# Publishes the read-only demo page (src/public_site.py) to GitHub Pages:
# https://neevoswal19-maker.github.io/dip-committee/
# Rebuilt after every morning scan and intraday session, and daily as a
# backup. The page shows research output only; the database secret stays here.
on:
  workflow_run:
    workflows: ["Daily scan", "Intraday"]
    types: [completed]
  schedule:
    - cron: "30 10 * * *"            # 16:00 IST, backup
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the page
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python jobs/public_site.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
