name: ETF swing research

# Backtests the ETF relative-strength swing systems (2A metals, 2B sectors,
# 3 the portfolio) on long-history stand-ins and on the real ETFs, and
# uploads reports/etf_swing_research.md. Research only: no secrets, no
# database, no alerts.
on:
  workflow_dispatch:
  push:
    branches: ["etf-swing/**"]

concurrency:
  group: etf-swing-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the research
        run: python jobs/etf_swing_research.py

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-swing-research-${{ github.run_id }}
          path: reports/etf_swing_*
          retention-days: 30
          if-no-files-found: warn
