name: Option 1 research

# Backtests the live BUY rule (option 1: buy a screen pass unless the
# committee objects) with delivery confirmation replayed from NSE's daily
# bhavcopies, 2020 onward, and uploads reports/option1_research.md.
# Research only: no secrets, nothing written to the database.
#
# The first run downloads ~1,700 bhavcopies at NSE's polite rate (about 85
# minutes); they are cached, so reruns take minutes.
on:
  workflow_dispatch:
  push:
    branches: ["option1-research/**"]

concurrency:
  group: option1-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the bhavcopy cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: option1-cache-${{ github.run_id }}
          restore-keys: |
            option1-cache-

      - name: Run the backtest
        run: python jobs/option1_research.py

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option1-research-${{ github.run_id }}
          path: reports/option1_*
          retention-days: 30
          if-no-files-found: warn
