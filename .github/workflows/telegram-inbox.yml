name: Telegram inbox

on:
  schedule:
    # Every 15 minutes, every day. Telegram keeps unread messages for only 24
    # hours, so a purchase reported on a Saturday must still be read before
    # Sunday. GitHub often starts scheduled runs a few minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # Overlapping runs would be safe - each message is claimed in the database
  # before it is acted on - but there is no reason to have two.
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process messages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/process_telegram.py
