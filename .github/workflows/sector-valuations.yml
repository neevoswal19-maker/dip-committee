name: Sector valuations

# Weekly: the median P/E, price-to-book and free-cash-flow yield of each
# sector across the Nifty 500, for the Valuation Analyst to compare against.
# Timing does not matter, so GitHub's own scheduler is fine.
on:
  schedule:
    - cron: "37 3 * * 0"     # Sunday ~09:07 IST
  workflow_dispatch:

concurrency:
  group: sector-valuations
  cancel-in-progress: false

jobs:
  valuations:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute sector medians
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python jobs/sector_valuations.py
